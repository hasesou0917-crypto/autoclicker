<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AutoClicker Pro - Advanced</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-light: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-dark: #0284c7;
            --warn: #f59e0b;
            --danger: #ef4444;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--panel);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-light);
            z-index: 100;
        }
        h1 {
            font-size: 16px;
            margin: 0;
            color: var(--accent);
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        button.active {
            background-color: var(--danger);
            color: white;
        }
        button.secondary {
            background-color: var(--panel-light);
            color: var(--text);
        }
        #settings-panel {
            background-color: var(--panel);
            padding: 10px 15px;
            border-bottom: 1px solid var(--panel-light);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .setting-group label {
            color: var(--muted);
            font-size: 11px;
        }
        .setting-group input, .setting-group select {
            background: var(--panel-light);
            color: var(--text);
            border: 1px solid var(--muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        #workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, #1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .click-marker {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.4);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            transform: translate(-50%, -50%);
            touch-action: none;
            cursor: grab;
            z-index: 10;
        }
        .click-marker.clicking {
            background: rgba(239, 68, 68, 0.6);
            border-color: var(--danger);
            transform: translate(-50%, -50%) scale(0.9);
        }
        footer {
            background-color: var(--panel);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--panel-light);
            font-size: 12px;
            color: var(--muted);
            z-index: 100;
        }
    </style>
</head>
<body>
    <header>
        <h1>AutoClicker Pro</h1>
        <div class="controls">
            <button id="add-btn" class="secondary">＋追加</button>
            <button id="start-btn">開始</button>
        </div>
    </header>

    <div id="settings-panel">
        <div class="setting-group">
            <label for="interval-input">クリック間隔 (ms)</label>
            <input type="number" id="interval-input" value="500" min="50" step="50">
        </div>
        <div class="setting-group">
            <label for="mode-select">モード</label>
            <select id="mode-select">
                <option value="loop">無限ループ</option>
                <option value="once">順番に1周</option>
            </select>
        </div>
    </div>

    <div id="workspace"></div>

    <footer>
        <div>状態: <span id="status-text" style="color: var(--accent);">停止中</span></div>
        <div>タップ数: <span id="count-text">0</span></div>
    </footer>

    <script>
        const workspace = document.getElementById('workspace');
        const startBtn = document.getElementById('start-btn');
        const addBtn = document.getElementById('add-btn');
        const statusText = document.getElementById('status-text');
        const countText = document.getElementById('count-text');
        const intervalInput = document.getElementById('interval-input');
        const modeSelect = document.getElementById('mode-select');

        let markers = [];
        let isRunning = false;
        let totalCount = 0;
        let intervalId = null;

        function addMarker(x, y) {
            const id = markers.length + 1;
            const el = document.createElement('div');
            el.className = 'click-marker';
            el.innerText = id;
            el.style.left = x + 'px';
            el.style.top = y + 'px';

            let isDragging = false;
            let startX, startY;

            el.addEventListener('pointerdown', (e) => {
                isDragging = false;
                startX = e.clientX;
                startY = e.clientY;
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                    isDragging = true;
                    el.style.left = e.clientX + 'px';
                    el.style.top = e.clientY + 'px';
                }
            });

            el.addEventListener('pointerup', () => {
                if (!isDragging) {
                    workspace.removeChild(el);
                    markers = markers.filter(m => m.id !== id);
                    reorderMarkers();
                }
            });

            workspace.appendChild(el);
            markers.push({ id, el, x, y });
        }

        function reorderMarkers() {
            markers.forEach((m, index) => {
                m.id = index + 1;
                m.el.innerText = m.id;
            });
        }

        addBtn.addEventListener('click', () => {
            const rect = workspace.getBoundingClientRect();
            const x = rect.width / 2 + (Math.random() * 100 - 50);
            const y = rect.height / 2 + (Math.random() * 100 - 50);
            addMarker(x, y);
        });

        startBtn.addEventListener('click', () => {
            if (markers.length === 0) {
                alert('先に「＋追加」ボタンでタップ位置を配置してください！');
                return;
            }
            isRunning = !isRunning;
            if (isRunning) {
                startBtn.textContent = '停止';
                startBtn.classList.add('active');
                statusText.textContent = '実行中...';
                statusText.style.color = 'var(--danger)';
                
                let intervalTime = parseInt(intervalInput.value) || 500;
                let currentIndex = 0;

                intervalId = setInterval(() => {
                    markers.forEach(m => m.el.classList.remove('clicking'));
                    const current = markers[currentIndex];
                    
                    current.el.classList.add('clicking');
                    totalCount++;
                    countText.textContent = totalCount;

                    currentIndex++;
                    if (currentIndex >= markers.length) {
                        currentIndex = 0;
                        if (modeSelect.value === 'once') {
                            startBtn.click(); // 1周したら自動停止
                        }
                    }
                }, intervalTime);
            } else {
                startBtn.textContent = '開始';
                startBtn.classList.remove('active');
                statusText.textContent = '停止中';
                statusText.style.color = 'var(--accent)';
                clearInterval(intervalId);
                markers.forEach(m => m.el.classList.remove('clicking'));
            }
        });

        window.addEventListener('load', () => {
            addMarker(window.innerWidth / 2, window.innerHeight / 3);
        });
    </script>
</body>
</html>
